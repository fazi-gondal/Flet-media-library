name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Allow running from the Actions tab without a push (useful when iterating
  # on a branch or verifying after a merge without local Flutter/Android Studio).
  workflow_dispatch:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest tests -q

  dart:
    name: Flutter analyze + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze Dart package
        working-directory: src/flutter/flet_media_library
        run: |
          dart --version
          flutter pub get
          flutter analyze
          dart format .
          git diff
          dart format --set-exit-if-changed --output=none .
