# Adapted from Vidsaver's all-builds.yml (unsigned APK only).
# Builds the media_library_demo app so you can sideload-test flet-media-library.
# On version tags (v*), also publishes a GitHub Release with:
#   - MediaLibraryDemo-<tag>-Android-arm64-v8a.apk
#   - MediaLibraryDemo-<tag>-Android-arm64-v8a.zip  (zip -9 full compression)
# docs: https://docs.flet.dev/publish/#github-actions

name: Build Demo APK (unsigned)

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "src/**"
      - "examples/media_library_demo/**"
      - ".github/workflows/build-demo-apk.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/**"
      - "examples/media_library_demo/**"
      - ".github/workflows/build-demo-apk.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  # Suppress the Flet CLI update-check HTTP call that causes 504 failures in CI
  FLET_DISABLE_UPDATE_CHECK: "1"

jobs:
  build-apk:
    name: Build demo APK (arm64-v8a, unsigned)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            examples/media_library_demo/pyproject.toml
            src/flet_media_library/**/*.py
            src/flutter/flet_media_library/lib/**/*.dart
            src/flutter/flet_media_library/android/**/*
            src/flutter/flet_media_library/pubspec.yaml

      - name: Clean stale build artifacts
        working-directory: examples/media_library_demo
        run: |
          rm -rf build .venv .flet*
          find . -maxdepth 2 -type d -name '__pycache__' -exec rm -rf {} +

      # Build the local flet-media-library into a wheel so flet build's
      # internal pip resolver can install it (uv path sources are not visible
      # to pip, which flet build uses internally).
      - name: Build local Python package wheel
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flet-media-library-wheel"
          uv build \
            --wheel \
            --out-dir "$RUNNER_TEMP/flet-media-library-wheel"

      - name: Install demo dependencies
        working-directory: examples/media_library_demo
        run: uv sync --python 3.12

      # Rewrite the flet-media-library dependency line in pyproject.toml to
      # point at the local wheel via a file:// URI so flet build can resolve it.
      - name: Point demo to local package wheel
        working-directory: examples/media_library_demo
        run: |
          set -euo pipefail

          WHEEL="$(find "$RUNNER_TEMP/flet-media-library-wheel" \
            -maxdepth 1 \
            -type f \
            -name 'flet_media_library-*.whl' \
            | head -n 1)"

          test -n "$WHEEL"
          export WHEEL

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          wheel_uri = Path(os.environ["WHEEL"]).resolve().as_uri()

          updated, count = re.subn(
              r'(?m)^\s*"flet-media-library",\s*$',
              f'    "flet-media-library @ {wheel_uri}",\n',
              text,
          )

          if count != 1:
              raise SystemExit(
                  f"Could not replace flet-media-library dependency (matches={count})"
              )

          pyproject.write_text(updated)
          print(f"Using local wheel: {wheel_uri}")
          PY

      # Confirm the wheel ships flutter/flet_media_library/lib/flet_media_library.dart
      # so flet build can resolve the Flutter plugin from the installed package.
      - name: Verify wheel contains Flutter plugin
        run: |
          set -euo pipefail
          WHEEL="$(find "$RUNNER_TEMP/flet-media-library-wheel" \
            -maxdepth 1 -type f -name 'flet_media_library-*.whl' | head -n 1)"
          test -n "$WHEEL"
          echo "Wheel: $WHEEL"
          unzip -l "$WHEEL" | grep -E \
            'flutter/flet_media_library/(pubspec\.yaml|lib/flet_media_library\.dart)'
          echo "OK: Flutter plugin files confirmed in wheel"

      # Accept Android SDK licenses non-interactively (required on fresh runners).
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      # Verify entry point and Flutter plugin source before handing off to flet build.
      - name: Check demo entry point and Flutter plugin
        working-directory: examples/media_library_demo
        run: |
          echo "--- directory layout (depth 3) ---"
          find . -maxdepth 3 -not -path './.venv/*' -type f | sort
          echo "--- checking main.py ---"
          test -f main.py && echo "OK: main.py found" || (echo "MISSING: main.py" && exit 1)
          echo "--- checking Flutter plugin dart file ---"
          test -f ../../src/flutter/flet_media_library/lib/flet_media_library.dart \
            && echo "OK: flet_media_library.dart found" \
            || (echo "MISSING: flet_media_library.dart" && exit 1)
          echo "Flutter plugin contents:"
          find ../../src/flutter/flet_media_library -maxdepth 3 -type f -print

      # No ANDROID_KEYSTORE_* secrets — unsigned/debug-style APK for sideload
      # testing only. Not for Play Store.
      # Entry point: main.py at demo root (shim → src/main.py).
      # --no-sync prevents uv from reverting the pyproject.toml wheel patch.
      - name: Build Android APK
        working-directory: examples/media_library_demo
        shell: bash
        run: |
          set -euo pipefail
          # No --source-packages: the wheel ships flutter/flet_media_library/ in the
          # correct namespace so flet build can resolve the Flutter plugin.
          #
          # Retry loop: the Flet CLI makes an outbound HTTP call (update check /
          # asset download) that occasionally returns 504 on fresh CI runners.
          # FLET_DISABLE_UPDATE_CHECK suppresses it when supported; the loop
          # catches it when not.
          for attempt in 1 2 3; do
            echo "=== flet build attempt ${attempt}/3 ==="
            if uv run --python 3.12 --no-sync flet build apk \
                --module-name main \
                --split-per-abi \
                --arch arm64-v8a \
                --yes \
                --verbose; then
              echo "Build succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build failed on attempt ${attempt}; cleaning and retrying in 30 s..." >&2
              rm -rf build .flet* || true
              sleep 30
            fi
          done
          echo "flet build apk failed after 3 attempts." >&2
          exit 1

      - name: Verify APK output
        working-directory: examples/media_library_demo
        run: |
          set -euo pipefail
          ls -R build/apk || true
          APK="$(find build/apk -type f -name '*arm64-v8a*.apk' 2>/dev/null | head -n 1)"
          if [ -z "${APK}" ]; then
            APK="$(find build/apk -type f -name '*.apk' 2>/dev/null | head -n 1)"
          fi
          if [ -z "${APK}" ]; then
            echo "No APK found under build/apk" >&2
            find build -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          echo "Found APK: ${APK}"
          ls -lh "${APK}"

      - name: Stage release assets (APK + zip -9)
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Resolve APK path robustly
          APK="$(find examples/media_library_demo/build/apk -type f -name '*arm64-v8a*.apk' 2>/dev/null | head -n 1)"
          if [ -z "${APK}" ]; then
            APK="$(find examples/media_library_demo/build/apk -type f -name '*.apk' 2>/dev/null | head -n 1)"
          fi
          test -n "${APK}" && test -f "${APK}"

          VERSION="${GITHUB_REF_NAME}"
          if [[ "${VERSION}" != v* ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          APK_NAME="MediaLibraryDemo-${VERSION}-Android-arm64-v8a.apk"
          ZIP_NAME="MediaLibraryDemo-${VERSION}-Android-arm64-v8a.zip"

          cp "${APK}" "release-assets/${APK_NAME}"
          # Full compression (like Vidsaver release zip)
          (cd release-assets && zip -9 "${ZIP_NAME}" "${APK_NAME}")
          ls -lh release-assets
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Upload APK artifact (Actions Artifacts tab)
        uses: actions/upload-artifact@v4
        with:
          name: media-library-demo-apk-arm64
          path: |
            release-assets/*.apk
            release-assets/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release (APK + zip)
    needs: build-apk
    # Only on version tags, same pattern as Vidsaver
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: media-library-demo-apk-arm64
          path: release-assets

      - name: Show release assets
        run: ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/MediaLibraryDemo-${{ github.ref_name }}-Android-arm64-v8a.apk
            release-assets/MediaLibraryDemo-${{ github.ref_name }}-Android-arm64-v8a.zip
